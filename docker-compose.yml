services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ideaboard
      POSTGRES_PASSWORD: ideaboard
      POSTGRES_DB: ideaboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideaboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      DATABASE_URL: postgresql+psycopg://ideaboard:ideaboard@postgres:5432/ideaboard
      # No otel-lgtm collector here - export attempts just log harmless
      # background warnings, same as every local run throughout this project.
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./app/frontend
      target: build
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
