name: deploy

# Manual only, on purpose: every run here provisions real, billable cloud
# infra (EKS/RDS/NAT/NLB on aws). ci.yml and iac-contract.yml stay fully
# automatic because they're free and side-effect-free; this one isn't.
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud to deploy to"
        required: true
        type: choice
        options:
          - aws
        default: aws

permissions:
  id-token: write # required for OIDC -> aws-actions/configure-aws-credentials
  contents: read

jobs:
  deploy-aws:
    if: inputs.cloud == 'aws'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_DEPLOY_REGION }}
    steps:
      - uses: actions/checkout@v4

      # No stored AWS keys: this assumes gha-idea-board-deploy via OIDC,
      # trust-scoped to this exact repo+branch (see AssumeRolePolicyDocument
      # on the role itself) rather than a long-lived secret.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve account id and image URIs
        id: ecr
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "backend_uri=${registry}/idea-board-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_uri=${registry}/idea-board-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "evaluator_uri=${registry}/idea-board-ai-evaluator:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create ECR repositories (idempotent)
        run: |
          for repo in idea-board-backend idea-board-frontend idea-board-ai-evaluator; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" >/dev/null
          done

      - name: Build and push images
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.ecr.outputs.registry }}"

          docker build -t "${{ steps.ecr.outputs.backend_uri }}" app/backend
          docker push "${{ steps.ecr.outputs.backend_uri }}"

          docker build -t "${{ steps.ecr.outputs.frontend_uri }}" app/frontend
          docker push "${{ steps.ecr.outputs.frontend_uri }}"

          docker build -f ai/evaluator/Dockerfile -t "${{ steps.ecr.outputs.evaluator_uri }}" ai/
          docker push "${{ steps.ecr.outputs.evaluator_uri }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: terraform init
        working-directory: infra/live/aws
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=idea-board/aws/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      # Images already exist in ECR by this point, so the platform module's
      # kubernetes_deployment.ai_evaluator (wait_for_rollout) resolves
      # instead of hanging on an ImagePullBackOff until it times out.
      - name: terraform apply
        working-directory: infra/live/aws
        env:
          TF_VAR_ai_evaluator_image: ${{ steps.ecr.outputs.evaluator_uri }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        run: terraform apply -auto-approve

      - name: Build kubeconfig from terraform output
        working-directory: infra/live/aws
        run: |
          terraform output -raw kube_host > /tmp/kube_host
          terraform output -raw kube_ca | base64 -d > /tmp/kube_ca.crt
          terraform output -raw kube_token > /tmp/kube_token

          cat > /tmp/kubeconfig <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: idea-board
              cluster:
                server: $(cat /tmp/kube_host)
                certificate-authority: /tmp/kube_ca.crt
          users:
            - name: idea-board
              user:
                token: $(cat /tmp/kube_token)
          contexts:
            - name: idea-board
              context: { cluster: idea-board, user: idea-board }
          current-context: idea-board
          EOF

      - name: helm upgrade --install
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          helm upgrade --install idea-board deploy/helm/idea-board \
            --namespace ideaboard --create-namespace \
            --set backend.image.repository="${{ steps.ecr.outputs.registry }}/idea-board-backend" \
            --set backend.image.tag="${GITHUB_SHA}" \
            --set backend.image.pullPolicy=IfNotPresent \
            --set frontend.image.repository="${{ steps.ecr.outputs.registry }}/idea-board-frontend" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --set frontend.image.pullPolicy=IfNotPresent \
            --set ingress.host="" \
            --wait --timeout 5m

      - name: Print the public URL
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          echo "Waiting for the ingress-nginx LoadBalancer hostname..."
          for i in $(seq 1 30); do
            hostname=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$hostname" ] && break
            sleep 10
          done

          {
            echo "## idea-board-platform — AWS deploy"
            echo ""
            if [ -n "$hostname" ]; then
              echo "Public URL: http://${hostname}/"
              echo ""
              echo "(The ingress has no DNS hostname configured, so curl needs the LB"
              echo "hostname directly — no Host header required, ingress.host is wildcard.)"
            else
              echo "LoadBalancer hostname not ready yet — check \`kubectl -n ingress-nginx get svc\` manually."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
