# kind-on-OrbStack profile: images are loaded directly into the cluster
# (`kind load docker-image`), never pulled from a registry.
backend:
  image:
    pullPolicy: Never
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }

frontend:
  image:
    pullPolicy: Never
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

ingress:
  host: idea-board.local
